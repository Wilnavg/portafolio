<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Willian Navarro | Developer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Willian Navarro</h1>

        <p>Full Stack Developer en formación</p>

        <button id="saludoBtn">Conóceme</button>
        <p id="mensaje"></p>

    </header>


    <main>

        <section>

            <h2>Sobre mí</h2>

            <p>
                Soy estudiante de desarrollo de software
                interesado en crear aplicaciones web modernas.
            </p>

        </section>


        <section>

            <h2>Tecnologías</h2>

            <ul id="listaTecnologias"></ul>

        </section>


        <section>

            <h2>Proyectos</h2>

            <div id="listaProyectos"></div>

        </section>


        <section>
            <h2>Contacto</h2>

            <form id="formularioContacto">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Escribe tu email">

                <label for="mensajeContacto">Mensaje</label>
                <textarea id="mensajeContacto" placeholder="Escribe tu mensaje"></textarea>

            <button type="submit">Enviar mensaje</button>

            </form>

            <p id="resultadoFormulario"></p>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Willian Navarro
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
